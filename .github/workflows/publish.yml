name: Publish MariaDB Alpine Image

on:
  schedule:
    - cron: "17 3 * * 0"
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve latest Alpine Mini RootFS
        id: alpine
        shell: bash
        run: |
          version="$(curl -fsSL https://dl-cdn.alpinelinux.org/alpine/latest-stable/releases/x86_64/latest-releases.yaml \
            | awk '/title: "Mini root filesystem"/{found=1} found && /^  version:/{print $2; exit}')"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Using Alpine $version"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=candidate
            type=sha

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ALPINE_VERSION=${{ steps.alpine.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Promote only when latest changed
        shell: bash
        run: |
          set -euo pipefail
          candidate_digest="$(docker buildx imagetools inspect "${IMAGE}:candidate" \
            --format '{{.Manifest.Digest}}')"
          latest_digest="$(docker buildx imagetools inspect "${IMAGE}:latest" \
            --format '{{.Manifest.Digest}}' 2>/dev/null || true)"

          if [ "$candidate_digest" = "$latest_digest" ]; then
            echo "latest is unchanged; skipping promotion"
            exit 0
          fi

          docker buildx imagetools create \
            --tag "${IMAGE}:latest" \
            "${IMAGE}:candidate"
          echo "Promoted changed image to latest"
